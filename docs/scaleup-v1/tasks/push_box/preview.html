<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Push Box · 数据预览</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--panel:#fff;--ink:#172b39;--muted:#5b6b77;--line:#d7dfe5;--active:#236850;--soft:#e5f2ed}
@media(prefers-color-scheme:dark){:root{--bg:#10181e;--panel:#1b2730;--ink:#e9f0f4;--muted:#abbcc7;--line:#3a4b56;--active:#8cd3b7;--soft:#213e33}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}main{max-width:1600px;margin:auto;padding:24px}h1{font-size:25px;margin:0}h2{font-size:18px;margin:0 0 10px}p{margin:8px 0}.muted{color:var(--muted)}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}button,select,input{font:inherit}button,select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 12px}button{cursor:pointer}button:hover,button[aria-pressed=true]{border-color:var(--active);background:var(--soft)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--active);outline-offset:3px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}.controls label{display:flex;align-items:center;gap:6px}.viewer{background:var(--panel);padding:20px;border-radius:10px;margin-top:20px}.views{display:grid;grid-template-columns:1fr 1fr;gap:16px}video{display:block;width:100%;aspect-ratio:16/9;background:#111}.label{margin:0 0 7px;font-weight:600}.transport{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:15px 0}.transport input[type=range]{flex:1;min-width:140px;accent-color:var(--active)}#clock{font-variant-numeric:tabular-nums;min-width:105px}.phases{display:flex;flex-wrap:wrap;gap:7px}.phases button{font-size:13px;padding:5px 9px}.terminals{display:grid;grid-template-columns:1fr 1fr;gap:16px}.terminals img{width:100%;display:block}.terminal-toggle{margin-top:18px}.terminal-toggle summary{cursor:pointer;margin-bottom:10px}#observer-wrap{margin-top:16px;max-width:800px}#observer-wrap[hidden]{display:none}.catalog{margin-top:24px}.episode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.episode{padding:0;text-align:left;overflow:hidden}.episode img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#111}.episode .caption{padding:10px 12px}.episode strong{display:block;font-size:14px}.episode small{color:var(--muted);display:block}#empty{padding:20px}.error{color:#ba3939}footer{margin:24px 0;color:var(--muted)}@media(max-width:650px){main{padding:14px}.viewer{padding:12px}.views,.terminals{grid-template-columns:1fr}.episode-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.episode strong{font-size:12px}.episode .caption{padding:8px}.controls label{flex-wrap:wrap}h1{font-size:22px}}
</style>
<main>
<header><div><h1>Push Box · 数据预览</h1><p class="muted" id="counts" aria-live="polite">正在读取已验收数据…</p></div><button id="refresh">刷新列表</button></header>
<div class="controls">
<label>来源 <select id="source"><option value="new">本轮新增</option><option value="all">全部数据</option><option value="historical">历史复用</option></select></label>
<label>轨迹 <select id="trajectory"><option value="all">全部</option><option value="recovery">Recovery</option><option value="normal">Normal</option></select></label>
<label>Asset <select id="asset"><option value="all">全部</option><option value="cardboard-box-05">Box05</option><option value="cardboard-box-01">Box01</option><option value="cardboard-box-04">Box04</option></select></label>
<label>条件 <select id="difficulty"><option value="all">全部</option><option value="clean">Clean</option><option value="randomized">Randomized</option></select></label>
<span id="filtered" class="muted"></span>
</div>
<section class="viewer" aria-label="选中 episode 的视频和 terminal frame">
<h2 id="selected">选择一条 episode</h2><p id="metadata" class="muted"></p>
<div class="views"><div><p class="label">Ego view</p><video id="ego" controls preload="metadata" playsinline></video></div><div><p class="label">Task-centric view</p><video id="task" controls preload="metadata" playsinline></video></div></div>
<div class="transport"><button id="play">同步播放</button><button id="pause">暂停</button><button id="start">回到开头</button><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label><input id="seek" type="range" min="0" max="1" step="0.02" value="0" aria-label="同步跳转时间"><span id="clock">0.00 / 0.00 s</span></div>
<div id="phases" class="phases" aria-label="跳转到 expert 阶段"></div><p id="recovery" class="muted"></p>
<label><input type="checkbox" id="observer-toggle"> 显示 observer（诊断视角）</label><div id="observer-wrap" hidden><video id="observer" controls preload="none" playsinline></video></div>
<details class="terminal-toggle"><summary>查看 terminal frame（reset 前）</summary><div class="terminals"><div><p class="label">Ego terminal</p><img id="ego-terminal" alt="Ego terminal frame"></div><div><p class="label">Task-centric terminal</p><img id="task-terminal" alt="Task-centric terminal frame"></div></div></details>
</section>
<section class="catalog"><h2>Episode 列表</h2><div id="episodes" class="episode-grid"></div><p id="empty" hidden>当前筛选没有已验收数据。</p></section>
<footer>仅收录成功且通过完整验证的 demonstrations。列表每 30 秒更新；尚在运行、待验证和失败 attempts 不计入。缩略图来自初始 task-centric frame；视频使用原始 Canonical 文件，未为预览重新编码。</footer>
</main>
<script>
const $=id=>document.getElementById(id),views=[$('ego'),$('task')];let rows=[],selected=null,version='',detailToken=0;
const phaseNames={settle:'稳定姿态',approach:'接近',contact:'接触',push:'推进',recovery_contact_withdraw:'Recovery · 撤脚',recovery_contact_gap:'Recovery · 间隔',recovery_corrective_recontact:'Recovery · 再接近',corner_recovery:'Recovery · 调整'};
function media(uid,name){return '/media/'+encodeURIComponent(uid)+'/'+name}
function activeViews(){return $('observer-toggle').checked?[...views,$('observer')]:views}
function seek(seconds){activeViews().forEach(v=>{v.currentTime=Math.min(seconds,Number.isFinite(v.duration)?Math.max(0,v.duration-.001):seconds)});$('seek').value=seconds;updateClock()}
function pause(){activeViews().forEach(v=>v.pause())}
function updateClock(){if(!selected)return;let t=views[0].currentTime||0;$('seek').value=t;$('clock').textContent=t.toFixed(2)+' / '+selected.duration.toFixed(2)+' s'}
function filteredRows(){return rows.filter(r=>($('source').value==='all'||r.source===$('source').value)&&['trajectory','asset','difficulty'].every(k=>$(k).value==='all'||r.metadata[k==='trajectory'?'trajectory_type':k==='asset'?'asset_id':k]===$(k).value))}
function draw(){let shown=filteredRows();$('filtered').textContent='当前显示 '+shown.length+' 条';$('empty').hidden=shown.length>0;let grid=$('episodes');grid.replaceChildren();for(let r of shown){let b=document.createElement('button');b.className='episode';b.setAttribute('aria-pressed',String(selected?.uid===r.uid));let img=document.createElement('img');img.src='/thumb/'+r.uid+'.jpg';img.loading='lazy';img.alt=r.uid+' 初始 task-centric frame';let c=document.createElement('div');c.className='caption';let title=document.createElement('strong');title.textContent=r.uid;let info=document.createElement('small');info.textContent=(r.source==='new'?'新增':'历史复用')+' · '+r.metadata.trajectory_type+' · '+r.metadata.asset_id.replace('cardboard-','')+' · '+r.duration.toFixed(2)+' s';c.append(title,info);b.append(img,c);b.onclick=()=>choose(r);grid.append(b)}if(shown.length&&!shown.some(r=>r.uid===selected?.uid))choose(shown[0]);}
async function choose(r){if(selected?.uid===r.uid)return;pause();selected=r;let token=++detailToken;$('selected').textContent=r.uid;$('metadata').textContent=[r.source==='new'?'本轮新增 · a'+String(r.attempt).padStart(2,'0'):'历史复用 · '+r.historical_uid,r.metadata.asset_id,r.metadata.trajectory_type,r.metadata.difficulty,r.metadata.appearance_preset,r.metadata.split,r.frames+' frames · '+r.duration.toFixed(2)+' s'].join('　|　');views.forEach((v,i)=>{v.src=media(r.uid,i?'task.mp4':'ego.mp4');v.poster='/thumb/'+r.uid+'/'+(i?'task':'ego')+'.jpg';v.playbackRate=Number($('speed').value)});$('ego-terminal').src=media(r.uid,'ego-terminal.png');$('task-terminal').src=media(r.uid,'task-terminal.png');$('seek').max=r.duration;$('seek').value=0;$('clock').textContent='0.00 / '+r.duration.toFixed(2)+' s';$('phases').replaceChildren();$('recovery').textContent='';$('observer-toggle').checked=false;$('observer-wrap').hidden=true;$('observer').removeAttribute('src');draw();try{let d=await(await fetch('/api/detail/'+r.uid)).json();if(token!==detailToken)return;for(let p of d.phases){let b=document.createElement('button');b.textContent=(phaseNames[p.name]||p.name)+' · '+p.seconds.toFixed(2)+' s';b.onclick=()=>seek(p.seconds);$('phases').append(b)}if(d.recovery)$('recovery').textContent='Recovery：此前推进 '+(d.recovery.progress_before*100).toFixed(1)+' cm，最大几何间隔 '+(d.recovery.max_separation*100).toFixed(1)+' cm；最终任务成功。';$('observer-toggle').disabled=!d.observer_available}catch(e){$('recovery').textContent='阶段信息暂时无法读取。'}}
async function refresh(){try{let d=await(await fetch('/api/episodes',{cache:'no-store'})).json();$('counts').textContent='已验收 '+d.accepted+' / '+d.target+' 条 · 新增 '+d.new+' · 历史复用 '+d.historical;rows=d.episodes;let next=rows.map(r=>r.uid).join(',');if(next!==version){version=next;draw()}}catch(e){$('counts').textContent='列表读取失败，请刷新。'}}
$('play').onclick=()=>activeViews().forEach(v=>{v.currentTime=views[0].currentTime;v.playbackRate=Number($('speed').value);v.play().catch(()=>{})});$('pause').onclick=pause;$('start').onclick=()=>{pause();seek(0)};$('speed').onchange=()=>activeViews().forEach(v=>v.playbackRate=Number($('speed').value));$('seek').oninput=()=>seek(Number($('seek').value));views[0].ontimeupdate=()=>{updateClock();for(let v of activeViews().slice(1)){if(!views[0].paused&&!v.paused&&Math.abs(v.currentTime-views[0].currentTime)>.1)v.currentTime=views[0].currentTime}};views[0].onseeked=()=>{for(let v of activeViews().slice(1))if(Math.abs(v.currentTime-views[0].currentTime)>.05)v.currentTime=views[0].currentTime};$('observer-toggle').onchange=()=>{let on=$('observer-toggle').checked;$('observer-wrap').hidden=!on;if(on&&selected){$('observer').src=media(selected.uid,'observer.mp4');$('observer').onloadedmetadata=()=>{$('observer').currentTime=views[0].currentTime;$('observer').playbackRate=Number($('speed').value);if(!views[0].paused)$('observer').play().catch(()=>{})}}else $('observer').pause()};['source','trajectory','asset','difficulty'].forEach(id=>$(id).onchange=draw);$('refresh').onclick=refresh;refresh();setInterval(refresh,30000);
</script>
</html>
